<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Character Commission</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    /* This makes the viewer take up the full screen */
    body { margin: 0; padding: 0; background-color: #f4f4f4; }
    model-viewer { width: 100vw; height: 100vh; }
    
    /* A simple button style for the AR trigger */
    .ar-button {
      background-color: white;
      border-radius: 4px;
      border: none;
      position: absolute;
      bottom: 16px;
      right: 16px;
      padding: 10px 20px;
      font-weight: bold;
      box-shadow: 0px 2px 4px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

  <model-viewer 
    src="frog.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1"
    autoplay>
    
    <button slot="ar-button" class="ar-button">
      View in your space
    </button>
    
  </model-viewer>

</body>
</html>
